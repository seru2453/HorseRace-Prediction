[project]
name = "horseprediction"
version = "0.1.0"
description = "Personal JRA race analysis and prediction support MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.0",
  "beautifulsoup4>=4.12",
  "numpy>=2.0",
  "pandas>=2.0",
  "joblib>=1.4",
  "scikit-learn>=1.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
local = ["flask>=3.0", "httpx2>=2.0", "pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]
e2e = ["playwright>=1.45"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "database*", "services*"]
exclude = ["tests*", "migrations*", "fixtures*", "data*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
