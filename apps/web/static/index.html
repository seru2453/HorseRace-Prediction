<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7faf8">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <title>競馬予想支援</title>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <header class="app-header">
        <div>
          <h1>競馬予想支援</h1>
          <p class="app-subtitle">JRA レース分析</p>
          <p class="service-disclaimer">本アプリはJRA公式サービスではありません。</p>
        </div>
        <div class="header-actions">
          <button id="open-history" class="secondary-button compact-button has-icon" type="button"><span class="app-icon icon-hn-clock" aria-hidden="true"></span><span>履歴</span></button>
          <details id="local-admin-tools" class="utility-menu hidden">
            <summary title="その他の操作" aria-label="その他の操作">
              <span class="app-icon icon-pixel-menu pixel-menu-icon" aria-hidden="true"></span>
            </summary>
            <div class="utility-menu-panel">
              <button id="diagnose-provider" class="secondary-button has-icon" type="button"><span class="app-icon admin-action-icon icon-pixel-search" aria-hidden="true"></span><span>取得診断</span></button>
              <button id="export-data" class="secondary-button has-icon" type="button"><span class="app-icon admin-action-icon icon-pixel-download" aria-hidden="true"></span><span>データ出力</span></button>
              <button id="import-data" class="secondary-button has-icon" type="button"><span class="app-icon admin-action-icon icon-pixel-upload" aria-hidden="true"></span><span>データ読込</span></button>
            </div>
          </details>
        </div>
      </header>
      <form id="race-form" class="race-form">
        <div class="race-form-heading"><h2><span class="app-icon icon-pixel-flag" aria-hidden="true"></span>レース選択</h2></div>
        <label><span class="field-caption"><span class="app-icon icon-pixel-calendar" aria-hidden="true"></span>開催日</span><input id="race-date" type="date" required></label>
        <label><span class="field-caption"><span class="app-icon icon-pixel-map" aria-hidden="true"></span>競馬場</span><select id="racecourse" required><option value="">開催情報を読み込み中</option></select></label>
        <label><span class="field-caption"><span class="app-icon icon-pixel-target" aria-hidden="true"></span>レース番号</span><select id="race-number" required><option value="">--</option></select></label>
        <button class="analyze-button has-icon" type="submit"><span class="app-icon icon-pixel-sparkles" aria-hidden="true"></span><span>分析開始</span></button>
        <input id="import-file" class="hidden" type="file" accept="application/json">
      </form>
    </section>

    <section id="progress" class="progress hidden" aria-live="polite"></section>
    <section id="error" class="error hidden"></section>

    <nav id="tabs" class="tabs hidden">
      <button data-tab="analysis" class="active"><span class="app-icon icon-hn-analytics" aria-hidden="true"></span><span>AI予想</span></button>
      <button data-tab="entries"><span class="app-icon icon-hn-clipboard" aria-hidden="true"></span><span>出馬表</span></button>
      <button data-tab="simulation"><span class="app-icon icon-hn-chart-line" aria-hidden="true"></span><span>展開</span></button>
      <button data-tab="user"><span class="app-icon icon-pixel-user" aria-hidden="true"></span><span>自分の予想</span></button>
      <button data-tab="review"><span class="app-icon icon-pixel-trophy" aria-hidden="true"></span><span>結果</span></button>
      <button data-tab="history"><span class="app-icon icon-pixel-clock" aria-hidden="true"></span><span>履歴</span></button>
    </nav>

    <section id="summary" class="summary hidden"></section>
    <section id="entries" class="tab-panel hidden"></section>
    <section id="analysis" class="tab-panel"></section>
    <section id="simulation" class="tab-panel hidden"></section>
    <section id="user" class="tab-panel hidden"></section>
    <section id="review" class="tab-panel hidden"></section>
    <section id="learning" class="tab-panel hidden"></section>
    <section id="snapshots" class="tab-panel hidden"></section>
    <section id="history" class="tab-panel hidden"></section>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
