<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087553">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <title>競馬予想支援</title>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <header class="app-header">
        <div>
          <h1>競馬予想支援</h1>
          <p>JRA レース分析</p>
        </div>
        <div class="header-actions">
          <button id="open-history" class="secondary-button compact-button" type="button">履歴</button>
          <details class="utility-menu">
            <summary title="その他の操作">その他</summary>
            <div class="utility-menu-panel">
              <button id="diagnose-provider" class="secondary-button" type="button">取得診断</button>
              <button id="export-data" class="secondary-button" type="button">データ出力</button>
              <button id="import-data" class="secondary-button" type="button">データ読込</button>
            </div>
          </details>
        </div>
      </header>
      <form id="race-form" class="race-form">
        <label>開催日<input id="race-date" type="date" required></label>
        <label>競馬場<select id="racecourse"><option>札幌</option><option>函館</option><option>福島</option><option>新潟</option><option>東京</option><option>中山</option><option>中京</option><option>京都</option><option>阪神</option><option>小倉</option></select></label>
        <label>レース番号<select id="race-number"></select></label>
        <button class="analyze-button" type="submit">分析開始</button>
        <input id="import-file" class="hidden" type="file" accept="application/json">
      </form>
    </section>

    <section id="progress" class="progress hidden" aria-live="polite"></section>
    <section id="error" class="error hidden"></section>

    <nav id="tabs" class="tabs hidden">
      <button data-tab="analysis" class="active">AI予想</button>
      <button data-tab="entries">出馬表</button>
      <button data-tab="simulation">展開</button>
      <button data-tab="user">自分の予想</button>
      <button data-tab="review">結果</button>
      <button data-tab="history">履歴</button>
    </nav>

    <section id="summary" class="summary hidden"></section>
    <section id="entries" class="tab-panel hidden"></section>
    <section id="analysis" class="tab-panel"></section>
    <section id="simulation" class="tab-panel hidden"></section>
    <section id="user" class="tab-panel hidden"></section>
    <section id="review" class="tab-panel hidden"></section>
    <section id="learning" class="tab-panel hidden"></section>
    <section id="snapshots" class="tab-panel hidden"></section>
    <section id="history" class="tab-panel hidden"></section>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
