<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/vendor/material-kit.min.css">
  <link rel="stylesheet" href="/styles.css">
  <title>競馬予想支援</title>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <header class="app-header card">
        <div>
          <h1><span>競馬予想支援</span></h1>
          <p class="app-subtitle">JRA レース分析</p>
          <p class="service-disclaimer">本アプリはJRA公式サービスではありません。</p>
        </div>
        <div class="header-actions">
          <button id="open-history" class="btn btn-outline-secondary secondary-button compact-button" type="button">履歴</button>
          <details id="local-admin-tools" class="utility-menu hidden">
            <summary class="btn btn-outline-secondary" title="その他の操作" aria-label="その他の操作">
              <span aria-hidden="true">⋮</span>
            </summary>
            <div class="utility-menu-panel">
              <button id="diagnose-provider" class="btn btn-outline-secondary secondary-button" type="button">取得診断</button>
              <button id="export-data" class="btn btn-outline-secondary secondary-button" type="button">データ出力</button>
              <button id="import-data" class="btn btn-outline-secondary secondary-button" type="button">データ読込</button>
            </div>
          </details>
        </div>
      </header>
      <form id="race-form" class="race-form card">
        <div class="race-form-heading"><h2>レース選択</h2></div>
        <label><span class="field-caption">開催日</span><input id="race-date" class="form-control" type="date" required></label>
        <label><span class="field-caption">競馬場</span><select id="racecourse" class="form-select" required><option value="">開催情報を読み込み中</option></select></label>
        <label><span class="field-caption">レース番号</span><select id="race-number" class="form-select" required><option value="">--</option></select></label>
        <button class="btn btn-primary analyze-button" type="submit"><span>分析開始</span></button>
        <input id="import-file" class="hidden" type="file" accept="application/json">
      </form>
    </section>

    <div class="game-board">
      <nav id="tabs" class="tabs nav nav-tabs hidden" aria-label="分析メニュー">
          <button class="nav-link active" data-tab="analysis">AI予想</button>
          <button class="nav-link" data-tab="entries">出馬表</button>
          <button class="nav-link" data-tab="simulation">展開</button>
          <button class="nav-link" data-tab="user">自分の予想</button>
          <button class="nav-link" data-tab="review">結果</button>
          <button class="nav-link" data-tab="history">履歴</button>
        </nav>

      <div class="game-stage">
        <section id="progress" class="progress hidden" aria-live="polite"></section>
        <section id="error" class="error hidden"></section>
        <section id="summary" class="summary card hidden"></section>
        <section id="entries" class="tab-panel hidden"></section>
        <section id="analysis" class="tab-panel"><div class="welcome-screen card"><p class="welcome-kicker">JRA RACE ANALYSIS</p><h2>レースを選択してください</h2><p>開催日・競馬場・レース番号を選ぶと、AI予想と分析結果を表示します。</p></div></section>
        <section id="simulation" class="tab-panel hidden"></section>
        <section id="user" class="tab-panel hidden"></section>
        <section id="review" class="tab-panel hidden"></section>
        <section id="learning" class="tab-panel hidden"></section>
        <section id="snapshots" class="tab-panel hidden"></section>
        <section id="history" class="tab-panel hidden"></section>
      </div>
    </div>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
