name: Codex review gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  codex-review:
    name: codex-review
    if: github.event_name == 'pull_request' || github.event.issue.pull_request != null
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Wait for a clean Codex review of this exact commit
        uses: actions/github-script@v7
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { execFileSync } = require('child_process');
            const pullNumber = context.eventName === 'pull_request'
              ? context.payload.pull_request.number
              : context.issue.number;
            const initialPull = context.eventName === 'pull_request'
              ? context.payload.pull_request
              : (await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullNumber,
                })).data;
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA || initialPull.head.sha;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            if (initialPull.draft) {
              core.setFailed('Mark the PR ready for review before the Codex review gate can pass.');
              return;
            }

            for (let attempt = 0; attempt < 120; attempt += 1) {
              const pull = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
              });
              if (pull.data.head.sha !== expectedHeadSha) {
                core.setFailed('PR head changed while waiting; the new commit requires a new review gate run.');
                return;
              }

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                per_page: 100,
              });
              const result = JSON.parse(execFileSync(
                'python3',
                ['scripts/codex_review_gate.py', '--head-sha', expectedHeadSha],
                { input: JSON.stringify(comments), encoding: 'utf8' },
              ));

              if (result.status === 'passed') {
                core.info(result.reason);
                return;
              }
              if (result.status === 'blocked') {
                core.setFailed(result.reason);
                return;
              }
              core.info(`${result.reason} Waiting for Codex review (${attempt + 1}/120).`);
              if (attempt < 119) await sleep(30000);
            }

            core.setFailed('Timed out waiting for a completed Codex review of the current PR head.');
